version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "03:00"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      npm-minor:
        update-types:
          - "minor"
    ignore:
      - dependency-name: "puppeteer"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "puppeteer-extra"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "puppeteer-extra-plugin-stealth"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
      time: "03:30"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "04:00"
      timezone: "Asia/Kathmandu"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(actions)"
